# The cue table: game truth, independent of whoever recorded the audio.
#
# Every id is spelled in Elite Dangerous's own words. A journal cue is the event
# name, followed by a field and a value where one payload field narrows it. A status
# cue is the flag name followed by Set or Cleared; a status value is its name followed
# by what it became. The words a reader sees are generated from the id, never written
# here. A voice's recordings are found by the id alone.
#
# cooldown is in seconds. A cue with no cooldown may fire as often as its event does.

# ------------------------------------------------------------------ the application

# Played once when a voice is chosen. Its source is the application rather than the
# game, so no journal line or status change ever reaches it.

[[cue]]
id = "Cast.Confirmed"
source = "application"
event = "cast"
priority = "notice"

