# The cue table: game truth, independent of whoever recorded the audio.
#
# Every id is spelled in Elite Dangerous's own words. A journal cue is the event
# name, followed by a field and a value where one payload field narrows it. A status
# cue is the flag name followed by Set or Cleared; a status value is its name followed
# by what it became. A title is generated from the id and never written here. The
# purpose is the exception: one sentence saying when the cue is heard, written by hand
# and required of every cue (FR-231). A voice's recordings are found by the id alone.
#
# cooldown is in seconds. A cue with no cooldown may fire as often as its event does.

# ------------------------------------------------------------------- the categories

# Chatter lists the moments under these, in this order (FR-634, FR-635). Every cue the
# game raises names one; the cue from the application names none.

[[category]]
name = "Combat and danger"

[[category]]
name = "Flight and travel"

[[category]]
name = "Docking and stations"

[[category]]
name = "Comms"

[[category]]
name = "Ship systems"

[[category]]
name = "Exploration"

[[category]]
name = "Trade, missions and outfitting"

[[category]]
name = "Materials and engineering"

[[category]]
name = "On foot and vehicles"

[[category]]
name = "Fleet carriers"

[[category]]
name = "Wings, squadrons and friends"

[[category]]
name = "Session"

# ------------------------------------------------------------------ the application

# Played once when a voice is chosen. Its source is the application rather than the
# game, so no journal line or status change ever reaches it.

[[cue]]
id = "Cast.Confirmed"
purpose = "When you cast this voice, to confirm it is now the one speaking."
source = "application"
event = "cast"
priority = "notice"

